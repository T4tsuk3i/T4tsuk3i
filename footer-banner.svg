  <rect x="1" y="1" width="998" height="118" rx="18" ry="18" fill="url(#bg)" stroke="url(#accent)" stroke-width="2"/>
  <text x="500" y="58" font-family="Fira Code, Consolas, monospace" font-size="28" fill="#cdd6f4" text-anchor="middle">Always learning something new.</text>
  <text x="500" y="90" font-family="Fira Code, Consolas, monospace" font-size="13" fill="#bac2de" text-anchor="middle">keep breaking &#183; keep building &#183; keep exploring</text>
